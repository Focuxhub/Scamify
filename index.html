<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scamify Music Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf4f8',
                            100: '#fbe8f2',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.8); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 h-screen flex flex-col overflow-hidden transition-colors duration-300">

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-20 transition-colors duration-300">
            <!-- Logo area -->
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center text-white shadow-lg shadow-pink-500/30">
                        <i class="fa-solid fa-headphones-simple text-lg"></i>
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-pink-500 to-rose-500 bg-clip-text text-transparent">Scamify</span>
                </div>
                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
                <a href="#" onclick="switchView('home')" id="nav-home" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition bg-pink-500 text-white shadow-md shadow-pink-500/20">
                    <i class="fa-solid fa-house w-5"></i>
                    <span>Discover</span>
                </a>
                <a href="#" onclick="switchView('search')" id="nav-search" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                    <i class="fa-solid fa-magnifying-glass w-5"></i>
                    <span>Search</span>
                </a>
                <a href="#" onclick="switchView('favorites')" id="nav-favorites" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                    <i class="fa-solid fa-heart w-5"></i>
                    <span>Liked Songs</span>
                </a>
                <a href="#" onclick="switchView('playlists')" id="nav-playlists" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                    <i class="fa-solid fa-list-music w-5"></i>
                    <span>Playlists</span>
                </a>
                <a href="#" onclick="switchView('queue')" id="nav-queue" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                    <i class="fa-solid fa-layer-group w-5"></i>
                    <span>Queue</span>
                </a>
            </nav>

            <!-- Custom Upload Button Section -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-800">
                <label class="flex items-center justify-center space-x-2 w-full py-3 px-4 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl cursor-pointer text-sm font-medium transition shadow-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Upload Track</span>
                    <input type="file" id="mp3UploadInput" accept="audio/mp3,audio/*" class="hidden" onchange="handleFileUpload(event)">
                </label>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-gray-50 dark:bg-gray-950 overflow-hidden relative">
            
            <!-- Top Header Bar -->
            <header class="h-20 px-8 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-gray-900/50 backdrop-blur-md z-10">
                <div class="flex items-center space-x-4 flex-1 max-w-md">
                    <div class="relative w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                        <input type="text" id="headerSearchInput" placeholder="Search songs, artists, or genres..." oninput="handleGlobalSearch(this.value)" class="w-full pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-800 rounded-xl text-sm border-none focus:ring-2 focus:ring-pink-500 outline-none text-gray-900 dark:text-gray-100">
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="openCreatePlaylistModal()" class="flex items-center space-x-2 px-4 py-2 bg-pink-500 hover:bg-pink-600 text-white rounded-xl text-sm font-medium shadow-md shadow-pink-500/20 transition">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>New Playlist</span>
                    </button>
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-white font-bold text-sm shadow-md">
                        SC
                    </div>
                </div>
            </header>

            <!-- Dynamic Views Container -->
            <div id="viewContainer" class="flex-1 overflow-y-auto p-8">
                <!-- Dynamically injected views will go here -->
            </div>
        </main>
    </div>

    <footer class="h-24 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 px-6 flex items-center justify-between z-30 transition-colors duration-300">
        <!-- Currently Playing Song Info -->
        <div class="flex items-center space-x-4 w-1/4">
            <div id="currentCover" class="w-14 h-14 rounded-xl bg-gray-200 dark:bg-gray-800 flex items-center justify-center overflow-hidden shadow-md flex-shrink-0 relative">
                <i class="fa-solid fa-music text-gray-400 text-xl"></i>
            </div>
            <div class="overflow-hidden">
                <h4 id="currentTitle" class="text-sm font-semibold truncate text-gray-900 dark:text-gray-100">Select a track</h4>
                <p id="currentArtist" class="text-xs text-gray-500 dark:text-gray-400 truncate">Scamify Artist</p>
            </div>
            <button id="currentLikeBtn" onclick="toggleCurrentLike()" class="text-gray-400 hover:text-pink-500 transition text-lg ml-2">
                <i class="fa-regular fa-heart"></i>
            </button>
        </div>

        <!-- Center Player Controls & Seekbar -->
        <div class="flex flex-col items-center space-y-2 w-2/4 max-w-xl">
            <div class="flex items-center space-x-6">
                <button onclick="toggleShuffle()" id="shuffleBtn" class="text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 text-sm transition">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button onclick="playPrev()" class="text-gray-600 dark:text-gray-300 hover:text-pink-500 text-lg transition">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button onclick="togglePlay()" id="playPauseBtn" class="w-11 h-11 rounded-full bg-pink-500 hover:bg-pink-600 text-white flex items-center justify-center shadow-lg shadow-pink-500/30 transition transform hover:scale-105">
                    <i class="fa-solid fa-play text-sm ml-0.5"></i>
                </button>
                <button onclick="playNext()" class="text-gray-600 dark:text-gray-300 hover:text-pink-500 text-lg transition">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button onclick="toggleRepeat()" id="repeatBtn" class="text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 text-sm transition">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>
            <div class="flex items-center space-x-3 w-full text-xs text-gray-500 dark:text-gray-400">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)" class="flex-1 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-pink-500">
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <!-- Volume & Extras Controls -->
        <div class="flex items-center justify-end space-x-4 w-1/4">
            <button onclick="switchView('queue')" class="text-gray-400 hover:text-pink-500 text-sm transition relative" title="Queue">
                <i class="fa-solid fa-layer-group"></i>
                <span id="queueBadge" class="absolute -top-2 -right-2 bg-pink-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
            <div class="flex items-center space-x-2">
                <button onclick="toggleMute()" id="muteBtn" class="text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 text-sm transition">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <input type="range" id="volumeBar" value="80" min="0" max="100" oninput="setVolume(this.value)" class="w-20 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-pink-500">
            </div>
        </div>
    </footer>

    <div id="playlistModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-md p-6 shadow-2xl border border-gray-200 dark:border-gray-800">
            <div class="flex items-center justify-between mb-4">
                <h3 id="playlistModalTitle" class="text-lg font-bold">Create New Playlist</h3>
                <button onclick="closeCreatePlaylistModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form onsubmit="savePlaylist(event)" class="space-y-4">
                <input type="hidden" id="editPlaylistId">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1 uppercase tracking-wider">Playlist Name</label>
                    <input type="text" id="playlistNameInput" required placeholder="e.g. Chill Vibes" class="w-full px-4 py-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 border-none text-sm focus:ring-2 focus:ring-pink-500 outline-none text-gray-900 dark:text-gray-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1 uppercase tracking-wider">Description</label>
                    <textarea id="playlistDescInput" rows="3" placeholder="Optional description..." class="w-full px-4 py-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 border-none text-sm focus:ring-2 focus:ring-pink-500 outline-none text-gray-900 dark:text-gray-100 resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeCreatePlaylistModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-pink-500 hover:bg-pink-600 text-white shadow-md shadow-pink-500/20 transition">Save Playlist</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Default Library Tracks & Categories
        const defaultTracks = [
            {
                id: 't1',
                title: 'Neon Horizon',
                artist: 'CyberPulse',
                album: 'Synthwave Odyssey',
                duration: '3:45',
                durationSec: 225,
                cover: 'https://placehold.co/300x300/db2777/ffffff?text=Synth',
                url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
                category: 'Synthwave'
            },
            {
                id: 't2',
                title: 'Midnight Lofi & Chill',
                artist: 'Coffee Beats',
                album: 'Study Session',
                duration: '2:50',
                durationSec: 170,
                cover: 'https://placehold.co/300x300/831843/ffffff?text=Lofi',
                url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
                category: 'Lofi'
            },
            {
                id: 't3',
                title: 'Electro Bass Storm',
                artist: 'Vortex',
                album: 'Club Anthems',
                duration: '4:12',
                durationSec: 252,
                cover: 'https://placehold.co/300x300/581c87/ffffff?text=Electro',
                url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
                category: 'Electronic'
            },
            {
                id: 't4',
                title: 'Acoustic Morning Breeze',
                artist: 'Sarah Jenkins',
                album: 'Unplugged',
                duration: '3:20',
                durationSec: 200,
                cover: 'https://placehold.co/300x300/047857/ffffff?text=Acoustic',
                url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3',
                category: 'Acoustic'
            },
            {
                id: 't5',
                title: 'Starlight Serenade',
                artist: 'Luna Eclipse',
                album: 'Cosmic Dreams',
                duration: '3:55',
                durationSec: 235,
                cover: 'https://placehold.co/300x300/1d4ed8/ffffff?text=Cosmic',
                url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3',
                category: 'Ambient'
            }
        ];

        // Application State
        let tracks = [...defaultTracks];
        let playlists = JSON.parse(localStorage.getItem('scamify_playlists')) || [
            { id: 'p1', name: 'Workout Pump', description: 'High energy beats for training', tracks: ['t1', 't3'] },
            { id: 'p2', name: 'Late Night Focus', description: 'Smooth ambient & lofi', tracks: ['t2', 't5'] }
        ];
        let favorites = JSON.parse(localStorage.getItem('scamify_favorites')) || ['t1', 't4'];
        let queue = JSON.parse(localStorage.getItem('scamify_queue')) || [...defaultTracks.map(t => t.id)];
        let currentQueueIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let currentView = 'home';
        let searchKeyword = '';
        let currentCategoryFilter = 'All';
        let selectedPlaylistId = null;

        // Audio Element setup
        const audioElement = new Audio();
        audioElement.volume = 0.8;

        audioElement.addEventListener('ended', () => {
            if (isRepeat) {
                audioElement.currentTime = 0;
                audioElement.play();
            } else {
                playNext();
            }
        });

        audioElement.addEventListener('timeupdate', () => {
            if (!isNaN(audioElement.duration)) {
                const progress = (audioElement.currentTime / audioElement.duration) * 100;
                document.getElementById('progressBar').value = progress;
                document.getElementById('currentTime').innerText = formatTime(audioElement.currentTime);
                document.getElementById('durationTime').innerText = formatTime(audioElement.duration);
            }
        });

        // Initialize App on Window Load
        window.onload = function() {
            // Apply saved theme preference
            const savedTheme = localStorage.getItem('scamify_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            }

            // Load initial tracks from localStorage if any custom ones exist
            const savedCustomTracks = JSON.parse(localStorage.getItem('scamify_custom_tracks'));
            if (savedCustomTracks) {
                tracks = [...defaultTracks, ...savedCustomTracks];
            }

            updateQueueBadge();
            switchView('home');
        };

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            const themeIcon = document.getElementById('themeIcon');
            if (isDark) {
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('scamify_theme', 'dark');
            } else {
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('scamify_theme', 'light');
            }
        }

        function switchView(viewName, param = null) {
            currentView = viewName;
            selectedPlaylistId = param;

            // Update navigation UI highlights
            ['home', 'search', 'favorites', 'playlists', 'queue'].forEach(v => {
                const nav = document.getElementById(`nav-${v}`);
                if (nav) {
                    if (v === viewName) {
                        nav.className = 'flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-pink-500 text-white shadow-md shadow-pink-500/20';
                    } else {
                        nav.className = 'flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition';
                    }
                }
            });

            const container = document.getElementById('viewContainer');
            container.innerHTML = '';

            if (viewName === 'home') {
                renderHomeView(container);
            } else if (viewName === 'search') {
                renderSearchView(container);
            } else if (viewName === 'favorites') {
                renderFavoritesView(container);
            } else if (viewName === 'playlists') {
                if (selectedPlaylistId) {
                    renderSinglePlaylistView(container, selectedPlaylistId);
                } else {
                    renderPlaylistsView(container);
                }
            } else if (viewName === 'queue') {
                renderQueueView(container);
            }
        }

        function renderHomeView(container) {
            const categories = ['All', 'Synthwave', 'Lofi', 'Electronic', 'Acoustic', 'Ambient'];
            
            let html = `
                <div class="space-y-8 pb-12">
                    <!-- Hero Banner -->
                    <div class="relative rounded-3xl overflow-hidden bg-gradient-to-r from-pink-600 via-rose-600 to-purple-700 p-8 text-white shadow-xl">
                        <div class="relative z-10 max-w-lg space-y-3">
                            <span class="px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-xs font-semibold uppercase tracking-wider">Featured Release</span>
                            <h1 class="text-3xl font-bold">Immersive Audio Experience</h1>
                            <p class="text-pink-100 text-sm">Discover trending scamlists, custom uploaded tracks, and high fidelity soundscapes tailored just for you.</p>
                            <button onclick="playTrack('${tracks[0].id}')" class="px-6 py-2.5 bg-white text-pink-600 rounded-xl font-semibold text-sm shadow-lg hover:bg-pink-50 transition transform hover:scale-105">
                                <i class="fa-solid fa-play mr-2"></i> Listen Now
                            </button>
                        </div>
                        <div class="absolute right-6 -bottom-10 opacity-20 text-[180px] pointer-events-none">
                            <i class="fa-solid fa-compact-disc"></i>
                        </div>
                    </div>

                    <!-- Categories Filter -->
                    <div class="flex items-center space-x-2 overflow-x-auto pb-2">
            `;

            categories.forEach(cat => {
                const activeClass = currentCategoryFilter === cat ? 'bg-pink-500 text-white shadow-md shadow-pink-500/20' : 'bg-white dark:bg-gray-900 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 border border-gray-200 dark:border-gray-800';
                html += `<button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap ${activeClass}">${cat}</button>`;
            });

            html += `
                    </div>

                    <!-- Tracks Grid -->
                    <div>
                        <h2 class="text-xl font-bold mb-4">Trending Tracks</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="homeTracksGrid">
            `;

            const filteredTracks = currentCategoryFilter === 'All' ? tracks : tracks.filter(t => t.category === currentCategoryFilter);

            filteredTracks.forEach(track => {
                const isFav = favorites.includes(track.id);
                html += `
                    <div class="bg-white dark:bg-gray-900 rounded-2xl p-4 border border-gray-200 dark:border-gray-800 hover:shadow-xl transition group relative flex flex-col justify-between">
                        <div>
                            <div class="relative rounded-xl overflow-hidden mb-4 aspect-square bg-gray-100 dark:bg-gray-800 shadow-md">
                                <img src="${track.cover}" alt="${track.title}" onerror="this.src='https://placehold.co/300x300/db2777/ffffff?text=Music'" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <button onclick="playTrack('${track.id}')" class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-2xl">
                                    <div class="w-12 h-12 rounded-full bg-pink-500 flex items-center justify-center shadow-lg transform hover:scale-110 transition">
                                        <i class="fa-solid fa-play ml-0.5"></i>
                                    </div>
                                </button>
                            </div>
                            <h3 class="font-semibold text-sm truncate text-gray-900 dark:text-gray-100">${track.title}</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate mt-0.5">${track.artist}</p>
                        </div>
                        <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-100 dark:border-gray-800">
                            <span class="text-[11px] text-gray-400 font-medium">${track.duration}</span>
                            <div class="flex items-center space-x-2">
                                <button onclick="toggleFavorite('${track.id}')" class="text-gray-400 hover:text-pink-500 transition text-sm">
                                    <i class="${isFav ? 'fa-solid text-pink-500' : 'fa-regular'} fa-heart"></i>
                                </button>
                                <button onclick="openAddToPlaylistMenu(event, '${track.id}')" class="text-gray-400 hover:text-pink-500 transition text-sm" title="Add to Playlist">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderSearchView(container) {
            let html = `
                <div class="space-y-6 pb-12">
                    <div class="max-w-2xl mx-auto text-center space-y-3">
                        <h2 class="text-2xl font-bold">Search Tracks & Artists</h2>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
                            <input type="text" id="searchInputView" value="${searchKeyword}" oninput="executeSearch(this.value)" placeholder="Type to search songs, artists, albums..." class="w-full pl-12 pr-4 py-3 bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 text-sm focus:ring-2 focus:ring-pink-500 outline-none shadow-sm text-gray-900 dark:text-gray-100">
                        </div>
                    </div>
                    <div id="searchResultsList" class="max-w-4xl mx-auto space-y-2">
            `;

            const results = searchKeyword.trim() === '' ? tracks : tracks.filter(t => 
                t.title.toLowerCase().includes(searchKeyword.toLowerCase()) || 
                t.artist.toLowerCase().includes(searchKeyword.toLowerCase()) ||
                t.album.toLowerCase().includes(searchKeyword.toLowerCase())
            );

            if (results.length === 0) {
                html += `<div class="text-center py-12 text-gray-400">No tracks found matching "${searchKeyword}"</div>`;
            } else {
                results.forEach((track, index) => {
                    const isFav = favorites.includes(track.id);
                    html += `

        function playTrack(trackId) {
            const index = queue.indexOf(trackId);
            if (index !== -1) {
                currentQueueIndex = index;
            } else {
                queue.push(trackId);
                currentQueueIndex = queue.length - 1;
                updateQueueBadge();
            }

            const track = tracks.find(t => t.id === trackId);
            if (!track) return;

            audioElement.src = track.url;
            audioElement.play().then(() => {
                isPlaying = true;
                updatePlayButtonUI();
                updateBottomBarInfo(track);
                setupMediaSession(track);
            }).catch(err => {
                console.error("Playback error:", err);
            });
        }

        function playQueueIndex(index) {
            if (index >= 0 && index < queue.length) {
                currentQueueIndex = index;
                playTrack(queue[index]);
            }
        }

        function togglePlay() {
            if (queue.length === 0) return;
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
            } else {
                if (!audioElement.src && queue.length > 0) {
                    playTrack(queue[currentQueueIndex]);
                    return;
                }
                audioElement.play();
                isPlaying = true;
            }
            updatePlayButtonUI();
        }

        function playNext() {
            if (queue.length === 0) return;
            if (isShuffle) {
                currentQueueIndex = Math.floor(Math.random() * queue.length);
            } else {
                currentQueueIndex = (currentQueueIndex + 1) % queue.length;
            }
            playTrack(queue[currentQueueIndex]);
        }

        function playPrev() {
            if (queue.length === 0) return;
            currentQueueIndex = (currentQueueIndex - 1 + queue.length) % queue.length;
            playTrack(queue[currentQueueIndex]);
        }

        function seekAudio(val) {
            if (!isNaN(audioElement.duration)) {
                audioElement.currentTime = (val / 100) * audioElement.duration;
            }
        }

        function setVolume(val) {
            audioElement.volume = val / 100;
        }

        function toggleMute() {
            audioElement.muted = !audioElement.muted;
            const muteBtn = document.getElementById('muteBtn');
            muteBtn.innerHTML = audioElement.muted ? '<i class="fa-solid fa-volume-xmark text-red-500"></i>' : '<i class="fa-solid fa-volume-high"></i>';
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffleBtn');
            btn.className = isShuffle ? 'text-pink-500 text-sm transition' : 'text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 text-sm transition';
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;

            btn.className = isRepeat ? 'text-pink-500 text-sm transition' : 'text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 text-sm transition';
        }

        function updatePlayButtonUI() {
            const btn = document.getElementById('playPauseBtn');
            btn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause text-sm"></i>' : '<i class="fa-solid fa-play text-sm ml-0.5"></i>';
        }

        function updateBottomBarInfo(track) {
            document.getElementById('currentTitle').innerText = track.title;
            document.getElementById('currentArtist').innerText = track.artist;
            document.getElementById('currentCover').innerHTML = `<img src="${track.cover}" class="w-full h-full object-cover" onerror="this.innerHTML='<i class=\"fa-solid fa-music text-gray-400 text-xl\"></i>'">`;
            
            const likeBtn = document.getElementById('currentLikeBtn');
            const isFav = favorites.includes(track.id);
            likeBtn.innerHTML = `<i class="${isFav ? 'fa-solid text-pink-500' : 'fa-regular'} fa-heart"></i>`;
        }

        function updateQueueBadge() {
            document.getElementById('queueBadge').innerText = queue.length;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function setupMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    album: track.album,
                    artwork: [{ src: track.cover, sizes: '300x300', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', () => { audioElement.play(); isPlaying = true; updatePlayButtonUI(); });
                navigator.mediaSession.setActionHandler('pause', () => { audioElement.pause(); isPlaying = false; updatePlayButtonUI(); });
                navigator.mediaSession.setActionHandler('previoustrack', playPrev);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }
        }

        function toggleFavorite(trackId) {
            const index = favorites.indexOf(trackId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {

            }
            localStorage.setItem('scamify_favorites', JSON.stringify(favorites));
            
            // Re-render current view to reflect changes
            switchView(currentView, selectedPlaylistId);

            // Update current playing bar heart if it matches
            if (queue.length > 0) {
                const currentTrackId = queue[currentQueueIndex];
                if (currentTrackId === trackId) {
                    const likeBtn = document.getElementById('currentLikeBtn');
                    const isFav = favorites.includes(trackId);
                    likeBtn.innerHTML = `<i class="${isFav ? 'fa-solid text-pink-500' : 'fa-regular'} fa-heart"></i>`;
                }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const audioUrl = e.target.result;
                const newTrack = {
                    id: 'custom_' + Date.now(),
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    artist: 'Local Upload',
                    album: 'Custom Uploads',
                    duration: '3:00',
                    durationSec: 180,
                    cover: 'https://placehold.co/300x300/831843/ffffff?text=Upload',
                    url: audioUrl,
                    category: 'Electronic'
                };

                tracks.unshift(newTrack);
                queue.unshift(newTrack.id);
                updateQueueBadge();

                // Save custom tracks in localStorage
                const customTracks = tracks.filter(t => t.id.startsWith('custom_'));
                localStorage.setItem('scamify_custom_tracks', JSON.stringify(customTracks));

                switchView('home');
                playTrack(newTrack.id);
            };
            reader.readAsDataURL(file);
        }

            if (id) {

            menu.id = 'addToPlaylistDropdown';
            menu.className = 'absolute right-4 bottom-16 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-xl p-3 z-50 w-48 space-y-1';
            
            let html = `<div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-2 py-1">Add to Playlist</div>`;
            if (playlists.length === 0) {
                html += `<div class="text-xs text-gray-500 px-2 py-1">No playlists available</div>`;
            } else {
                playlists.forEach(p => {
                    html += `<button onclick="addTrackToPlaylist('${p.id}', '${trackId}')" class="w-full text-left px-2 py-1.5 text-xs rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition truncate text-gray-700 dark:text-gray-300">${p.name}</button>`;
                });
            }
            menu.innerHTML = html;
            event.currentTarget.parentElement.appendChild(menu);

            // Close on outside click
            setTimeout(() => {
                window.addEventListener('click', function closeMenu(e) {
                    if (!menu.contains(e.target)) {
                        menu.remove();
                        window.removeEventListener('click', closeMenu);
                    }
                });
            }, 100);
        }

        function addTrackToPlaylist(playlistId, trackId) {
            const playlist = playlists.find(p => p.id === playlistId);
            if (playlist && !playlist.tracks.includes(trackId)) {
                playlist.tracks.push(trackId);
                localStorage.setItem('scamify_playlists', JSON.stringify(playlists));
            }
            const menu = document.getElementById('addToPlaylistDropdown');
            if (menu) menu.remove();
        }
    </script>
</body>
</html>
